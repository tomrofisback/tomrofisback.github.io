name: Trigger Counter

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_increment]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call main counter workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.COUNTER_TOKEN }}" \
            https://api.github.com/repos/tomrofisback/tomrofisback.github.io/dispatches \
            -d '{"event_type": "increment"}'
